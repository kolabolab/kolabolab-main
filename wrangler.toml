# Cloudflare Workers configuration for KolaboLab
name = "kolabolab-api"
main = "./backend/workers-native.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Account ID (using Beryour@gmail.com's Account)
account_id = "1bcdd5533e68547452b2eefda2366a77"

# Observability settings for better debugging
[observability]
[observability.logs]
enabled = false
invocation_logs = true

[env.production]
name = "kolabolab-api"
routes = [
  { pattern = "api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

[env.dev]
name = "kolabolab-api-dev"
routes = [
  { pattern = "dev-api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

[env.staging]
name = "kolabolab-api-staging"
routes = [
  { pattern = "staging-api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

# Database connections (use Cloudflare D1 or external PostgreSQL)
[[env.production.d1_databases]]
binding = "DB"
database_name = "kolabolab-production"
database_id = "108293bb-d093-4147-84b2-41aecf35179a"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "kolabolab-dev"
database_id = "26627b7c-d2f0-49f7-a96b-40b7392136ae"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kolabolab-staging"
database_id = "42a0ff21-2f4a-4bba-8935-2a8edf8af62b"

# KV storage for sessions and cache
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "2999eb454f6f4b729c706b1c056735a3"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "2999eb454f6f4b729c706b1c056735a3"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "2999eb454f6f4b729c706b1c056735a3"

# R2 bucket for file uploads
[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads"

[[env.dev.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads-dev"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads-staging"

# Environment variables (set via Cloudflare dashboard or CLI)
[env.production.vars]
NODE_ENV = "production"
FRONTEND_URL = "https://kolabolab.com"
GOOGLE_CALLBACK_URL = "https://kolabolab-api.beryour.workers.dev/auth/google/callback"
LINKEDIN_CALLBACK_URL = "https://kolabolab-api.beryour.workers.dev/auth/linkedin/callback"
GITHUB_CALLBACK_URL = "https://kolabolab-api.beryour.workers.dev/auth/github/callback"

[env.dev.vars]
NODE_ENV = "development"
FRONTEND_URL = "https://0fc93d16.kolabolab-dev.pages.dev"
GOOGLE_CALLBACK_URL = "https://kolabolab-api-dev.beryour.workers.dev/auth/google/callback"
LINKEDIN_CALLBACK_URL = "https://kolabolab-api-dev.beryour.workers.dev/auth/linkedin/callback"
GITHUB_CALLBACK_URL = "https://kolabolab-api-dev.beryour.workers.dev/auth/github/callback"

[env.staging.vars]
NODE_ENV = "staging"
FRONTEND_URL = "https://kolabolab-dev.pages.dev"
GOOGLE_CALLBACK_URL = "https://kolabolab-api-staging.beryour.workers.dev/auth/google/callback"

