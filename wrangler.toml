# Cloudflare Workers configuration for KolaboLab
name = "kolabolab-api"
main = "backend/src/workers-main.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "kolabolab-api"
routes = [
  { pattern = "api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

[env.staging]
name = "kolabolab-api-staging"
routes = [
  { pattern = "staging-api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

# Database connections (use Cloudflare D1 or external PostgreSQL)
[[env.production.d1_databases]]
binding = "DB"
database_name = "kolabolab-production"
database_id = "108293bb-d093-4147-84b2-41aecf35179a"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kolabolab-staging"
database_id = "42a0ff21-2f4a-4bba-8935-2a8edf8af62b"

# KV storage for sessions and cache
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "2999eb454f6f4b729c706b1c056735a3"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "2999eb454f6f4b729c706b1c056735a3"

# R2 bucket for file uploads
[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads-staging"

# Environment variables (set via Cloudflare dashboard or CLI)
[env.production.vars]
NODE_ENV = "production"
FRONTEND_URL = "https://kolabolab.com"

[env.staging.vars]
NODE_ENV = "staging"
FRONTEND_URL = "https://staging.kolabolab.com"

# Secrets (set via wrangler secret put)
# wrangler secret put JWT_SECRET
# wrangler secret put JWT_REFRESH_SECRET
# wrangler secret put DB_PASSWORD
# wrangler secret put GOOGLE_CLIENT_SECRET
# wrangler secret put LINKEDIN_CLIENT_SECRET
# wrangler secret put GITHUB_CLIENT_SECRET
# wrangler secret put SMTP_PASSWORD
# wrangler secret put CLOUDINARY_API_SECRET

# Worker limits - removed for free plan compatibility
# [limits]
# cpu_ms = 50

# Build configuration - disabled for manual builds
# [build]
# command = "npm run build"
# cwd = "backend"

