# Cloudflare Workers configuration for KolaboLab
name = "kolabolab-api"
main = "backend/dist/main.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "kolabolab-api"
routes = [
  { pattern = "api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

[env.staging]
name = "kolabolab-api-staging"
routes = [
  { pattern = "staging-api.kolabolab.com/*", zone_name = "kolabolab.com" }
]

# Database connections - REPLACE WITH YOUR ACTUAL IDs
[[env.production.d1_databases]]
binding = "DB"
database_name = "kolabolab-production"
database_id = "REPLACE_WITH_PRODUCTION_DB_ID"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kolabolab-staging"
database_id = "REPLACE_WITH_STAGING_DB_ID"

# KV storage for sessions and cache - REPLACE WITH YOUR ACTUAL IDs
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_PRODUCTION_KV_ID"
preview_id = "REPLACE_WITH_PRODUCTION_KV_PREVIEW_ID"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_STAGING_KV_ID"
preview_id = "REPLACE_WITH_STAGING_KV_PREVIEW_ID"

# R2 bucket for file uploads
[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "kolabolab-uploads-staging"

# Environment variables
[env.production.vars]
NODE_ENV = "production"
FRONTEND_URL = "https://kolabolab.com"

[env.staging.vars]
NODE_ENV = "staging"
FRONTEND_URL = "https://staging.kolabolab.com"

# Worker limits
[limits]
cpu_ms = 50

# Build configuration
[build]
command = "npm run build"
cwd = "backend"