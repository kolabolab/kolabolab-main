# Cloudflare Pages Configuration
# This file configures automatic deployment from Git to Cloudflare Pages

[build]
command = "cd frontend && npm ci && npm run build"
destination = "frontend/dist"

[build.environment]
NODE_VERSION = "20"
NPM_VERSION = "10"

# Environment variables for build
[env.production]
VITE_API_URL = "https://api.kolabolab.com"
VITE_APP_ENV = "production"

[env.staging]
VITE_API_URL = "https://staging-api.kolabolab.com"
VITE_APP_ENV = "staging"

[env.preview]
VITE_API_URL = "https://staging-api.kolabolab.com"
VITE_APP_ENV = "preview"

# Redirects and headers
[[redirects]]
from = "/api/*"
to = "https://api.kolabolab.com/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"