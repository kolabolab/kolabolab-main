services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kolabolab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolabolab
      POSTGRES_USER: kolabolab
      POSTGRES_PASSWORD: kolabolab_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kolabolab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolabolab -d kolabolab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kolabolab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kolabolab_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kolabolab_network:
    driver: bridge