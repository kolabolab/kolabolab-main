<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for context -->
  <circle cx="30" cy="30" r="28" fill="url(#primaryGradient)" opacity="0.08"/>
  
  <!-- Handshake illustration -->
  <g transform="translate(30,30)">
    <!-- Left hand/arm -->
    <path d="M-20,-5 Q-18,-8 -15,-6 L-8,-2 Q-5,0 -3,2 L0,5" 
          fill="none" stroke="url(#primaryGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right hand/arm -->
    <path d="M20,-5 Q18,-8 15,-6 L8,-2 Q5,0 3,2 L0,5" 
          fill="none" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left hand -->
    <ellipse cx="-12" cy="-4" rx="4" ry="6" fill="url(#primaryGradient)" opacity="0.9" transform="rotate(-20)"/>
    
    <!-- Right hand -->
    <ellipse cx="12" cy="-4" rx="4" ry="6" fill="url(#accentGradient)" opacity="0.9" transform="rotate(20)"/>
    
    <!-- Connection point (handshake) -->
    <circle cx="0" cy="2" r="3" fill="url(#primaryGradient)" opacity="0.6"/>
    
    <!-- Collaboration sparkles -->
    <circle cx="-8" cy="-12" r="1.5" fill="url(#accentGradient)" opacity="0.7"/>
    <circle cx="8" cy="-12" r="1.5" fill="url(#primaryGradient)" opacity="0.7"/>
    <circle cx="0" cy="-15" r="1" fill="url(#accentGradient)" opacity="0.8"/>
  </g>
  
  <!-- Brand name -->
  <text x="70" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="url(#primaryGradient)">
    Kolabo
  </text>
  <text x="70" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#64748B" letter-spacing="0.5px">
    LAB
  </text>
  
  <!-- Tagline -->
  <text x="70" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="300" fill="#94A3B8" letter-spacing="0.3px">
    Tech for Good • Collaboration Platform
  </text>
</svg>