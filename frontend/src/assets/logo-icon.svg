<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for context -->
  <circle cx="30" cy="30" r="28" fill="url(#primaryGradient)" opacity="0.08"/>
  
  <!-- Handshake illustration -->
  <g transform="translate(30,30)">
    <!-- Left hand/arm -->
    <path d="M-20,-5 Q-18,-8 -15,-6 L-8,-2 Q-5,0 -3,2 L0,5" 
          fill="none" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right hand/arm -->
    <path d="M20,-5 Q18,-8 15,-6 L8,-2 Q5,0 3,2 L0,5" 
          fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left hand -->
    <ellipse cx="-12" cy="-4" rx="5" ry="7" fill="url(#primaryGradient)" opacity="0.9" transform="rotate(-20)"/>
    
    <!-- Right hand -->
    <ellipse cx="12" cy="-4" rx="5" ry="7" fill="url(#accentGradient)" opacity="0.9" transform="rotate(20)"/>
    
    <!-- Connection point (handshake) -->
    <circle cx="0" cy="2" r="4" fill="url(#primaryGradient)" opacity="0.6"/>
    
    <!-- Collaboration sparkles -->
    <circle cx="-10" cy="-15" r="2" fill="url(#accentGradient)" opacity="0.7"/>
    <circle cx="10" cy="-15" r="2" fill="url(#primaryGradient)" opacity="0.7"/>
    <circle cx="0" cy="-18" r="1.5" fill="url(#accentGradient)" opacity="0.8"/>
  </g>
</svg>