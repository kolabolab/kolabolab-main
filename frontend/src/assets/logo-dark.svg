<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle representing global connection -->
  <circle cx="30" cy="30" r="25" fill="url(#primaryGradientDark)" opacity="0.2"/>
  
  <!-- Interconnected nodes representing collaboration -->
  <g>
    <!-- Central hub node -->
    <circle cx="30" cy="30" r="6" fill="url(#primaryGradientDark)"/>
    
    <!-- Surrounding collaboration nodes -->
    <circle cx="15" cy="20" r="4" fill="url(#accentGradientDark)"/>
    <circle cx="45" cy="20" r="4" fill="url(#accentGradientDark)"/>
    <circle cx="15" cy="40" r="4" fill="url(#accentGradientDark)"/>
    <circle cx="45" cy="40" r="4" fill="url(#accentGradientDark)"/>
    
    <!-- Connection lines showing collaboration -->
    <line x1="30" y1="30" x2="15" y2="20" stroke="url(#primaryGradientDark)" stroke-width="2" opacity="0.8"/>
    <line x1="30" y1="30" x2="45" y2="20" stroke="url(#primaryGradientDark)" stroke-width="2" opacity="0.8"/>
    <line x1="30" y1="30" x2="15" y2="40" stroke="url(#primaryGradientDark)" stroke-width="2" opacity="0.8"/>
    <line x1="30" y1="30" x2="45" y2="40" stroke="url(#primaryGradientDark)" stroke-width="2" opacity="0.8"/>
    
    <!-- Inter-node connections -->
    <line x1="15" y1="20" x2="45" y2="20" stroke="url(#accentGradientDark)" stroke-width="1" opacity="0.6"/>
    <line x1="15" y1="40" x2="45" y2="40" stroke="url(#accentGradientDark)" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Brand name -->
  <text x="70" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="url(#primaryGradientDark)">
    Kolabo
  </text>
  <text x="70" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1" letter-spacing="0.5px">
    LAB
  </text>
  
  <!-- Tagline -->
  <text x="70" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="300" fill="#94A3B8" letter-spacing="0.3px">
    Tech for Good • Collaboration Platform
  </text>
</svg>