<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KolaboLab - Connect, Collaborate, and Create the Future" />
    <meta name="keywords" content="startup, collaboration, investment, entrepreneur, tech" />
    <meta name="author" content="KolaboLab Team" />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="KolaboLab - Connect, Collaborate, Create" />
    <meta property="og:description" content="Join a community of entrepreneurs, skilled collaborators, and investors building meaningful technology solutions with social impact." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kolabolab.com" />
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KolaboLab - Connect, Collaborate, Create" />
    <meta name="twitter:description" content="Join a community of entrepreneurs, skilled collaborators, and investors building meaningful technology solutions with social impact." />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#1B2A4A" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>KolaboLab - Connect, Collaborate, Create</title>
    
    <style>
      /* Prevent flash of unstyled content */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #F8FAFF;
      }
      
      /* Loading spinner styles */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #F8FAFF;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #E8EBF0;
        border-top: 4px solid #1B2A4A;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        margin-top: 16px;
        color: #4a5568;
        font-size: 16px;
        font-weight: 500;
      }
      
      /* Hide loading when app loads */
      .app-loaded #loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading indicator -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading KolaboLab...</div>
    </div>
    
    <!-- React app root -->
    <div id="root"></div>
    
    <!-- Main app script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide loading screen once app loads -->
    <script>
      window.addEventListener('load', function() {
        document.body.classList.add('app-loaded');
      });
    </script>
  </body>
</html>
