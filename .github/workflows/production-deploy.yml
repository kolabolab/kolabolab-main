name: 🚀 Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # 🔍 Pre-deployment Security Check
  security-check:
    name: 🔒 Security Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run comprehensive security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: 🔐 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # 🏗️ Production Build
  production-build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: [security-check]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          cd frontend && npm ci --production=false
          cd ../backend && npm ci --production=false

      - name: 🏗️ Build frontend for production
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://api.kolabolab.com

      - name: 🏗️ Build backend for production
        working-directory: ./backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🗜️ Optimize build artifacts
        run: |
          # Compress frontend assets
          cd frontend/dist && tar -czf ../frontend-build.tar.gz .
          # Compress backend assets
          cd ../../backend/dist && tar -czf ../backend-build.tar.gz .

      - name: 📸 Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: |
            frontend/frontend-build.tar.gz
            backend/backend-build.tar.gz
          retention-days: 30

  # 🚀 Deploy to Production
  deploy-production:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    needs: [production-build]
    environment:
      name: production
      url: https://kolabolab.com
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}

      - name: 🔧 Setup Wrangler CLI
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Extract build artifacts
        run: |
          cd frontend && tar -xzf frontend-build.tar.gz -C dist/
          cd ../backend && tar -xzf backend-build.tar.gz -C dist/

      - name: 🚀 Deploy frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kolabolab-production
          directory: frontend/dist
          gitHubToken: ${{ github.token }}

      - name: 🚀 Deploy backend to Cloudflare Workers
        working-directory: ./backend
        run: wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 🔄 Update database migrations
        run: |
          # Run database migrations if needed
          echo "Running production database migrations..."
          # wrangler d1 migrations apply kolabolab-production --env production

      - name: 🧪 Run production health checks
        run: |
          echo "Running production health checks..."
          sleep 30 # Wait for deployment to propagate
          
          # Check frontend
          curl -f https://kolabolab.com/health || exit 1
          
          # Check API
          curl -f https://api.kolabolab.com/api/health || exit 1
          
          # Check API documentation
          curl -f https://api.kolabolab.com/api/docs || exit 1

      - name: 📊 Performance audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://kolabolab.com
            https://kolabolab.com/startups
            https://kolabolab.com/login
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # 🔔 Post-deployment notifications
  notify-deployment:
    name: 🔔 Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
      - name: 📢 Notify team on success
        if: needs.deploy-production.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          title: '🚀 Production Deployment Successful!'
          text: |
            ✅ KolaboLab has been successfully deployed to production!
            
            🌐 Frontend: https://kolabolab.com
            ⚙️ API: https://api.kolabolab.com
            📚 Docs: https://api.kolabolab.com/api/docs
            
            📊 Release: ${{ github.event.release.tag_name }}
            🔗 Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📢 Notify team on failure
        if: needs.deploy-production.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          title: '❌ Production Deployment Failed!'
          text: |
            🚨 KolaboLab production deployment has failed!
            
            Please check the GitHub Actions logs for details.
            
            📊 Release: ${{ github.event.release.tag_name }}
            🔗 Commit: ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📧 Send email notification
        if: needs.deploy-production.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🚀 KolaboLab Production Deployment Successful'
          body: |
            Hello Team,
            
            KolaboLab has been successfully deployed to production!
            
            🌐 Website: https://kolabolab.com
            ⚙️ API: https://api.kolabolab.com
            📚 Documentation: https://api.kolabolab.com/api/docs
            
            Release: ${{ github.event.release.tag_name }}
            Commit: ${{ github.sha }}
            
            Best regards,
            KolaboLab CI/CD System
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KolaboLab CI/CD <noreply@kolabolab.com>

  # 🔄 Rollback capability
  rollback:
    name: 🔄 Rollback Capability
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: [deploy-production]
    environment:
      name: production-rollback
    
    steps:
      - name: 📥 Checkout previous release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}

      - name: 🔄 Rollback deployment
        run: |
          echo "Initiating rollback to previous version..."
          # Implement rollback logic here
          # This could involve deploying the previous version
          # or reverting database migrations if necessary