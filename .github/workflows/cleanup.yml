name: 🧹 Cleanup

on:
  schedule:
    # Run cleanup every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      cleanup_type:
        description: 'Type of cleanup to perform'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - artifacts
        - caches
        - packages
        - deployments

jobs:
  cleanup-artifacts:
    name: 🗑️ Cleanup Artifacts
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'artifacts' || github.event_name == 'schedule'
    
    steps:
    - name: 🗑️ Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 30); // Keep artifacts for 30 days
          
          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < cutoffDate) {
              console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
          }

  cleanup-caches:
    name: 🗑️ Cleanup Caches
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'caches' || github.event_name == 'schedule'
    
    steps:
    - name: 🗑️ Delete old caches
      uses: actions/github-script@v7
      with:
        script: |
          const caches = await github.rest.actions.getActionsCacheList({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 7); // Keep caches for 7 days
          
          for (const cache of caches.data.actions_caches) {
            const createdAt = new Date(cache.created_at);
            if (createdAt < cutoffDate) {
              console.log(`Deleting cache: ${cache.key} (${cache.created_at})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
          }

  cleanup-packages:
    name: 🗑️ Cleanup Packages
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'packages' || github.event_name == 'schedule'
    
    steps:
    - name: 🗑️ Delete old package versions
      uses: actions/github-script@v7
      with:
        script: |
          try {
            const packages = await github.rest.packages.listPackagesForOrganization({
              org: context.repo.owner,
              package_type: 'container',
              per_page: 100
            });
            
            for (const pkg of packages.data) {
              if (pkg.name.includes('kolabolab')) {
                const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  org: context.repo.owner,
                  package_type: 'container',
                  package_name: pkg.name,
                  per_page: 100
                });
                
                // Keep latest 10 versions, delete older ones
                const versionsToDelete = versions.data.slice(10);
                
                for (const version of versionsToDelete) {
                  console.log(`Deleting package version: ${pkg.name}:${version.name}`);
                  await github.rest.packages.deletePackageVersionForOrg({
                    org: context.repo.owner,
                    package_type: 'container',
                    package_name: pkg.name,
                    package_version_id: version.id
                  });
                }
              }
            }
          } catch (error) {
            console.log('Package cleanup skipped (may not have packages or permissions)');
          }

  cleanup-deployments:
    name: 🗑️ Cleanup Deployments
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'deployments' || github.event_name == 'schedule'
    
    steps:
    - name: 🗑️ Delete old deployments
      uses: actions/github-script@v7
      with:
        script: |
          const deployments = await github.rest.repos.listDeployments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 30); // Keep deployments for 30 days
          
          for (const deployment of deployments.data) {
            const createdAt = new Date(deployment.created_at);
            if (createdAt < cutoffDate && deployment.environment !== 'production') {
              console.log(`Deleting deployment: ${deployment.id} (${deployment.environment})`);
              
              // First, mark deployment as inactive
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive'
              });
              
              // Then delete the deployment
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id
              });
            }
          }

  cleanup-workflow-runs:
    name: 🗑️ Cleanup Workflow Runs
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event_name == 'schedule'
    
    steps:
    - name: 🗑️ Delete old workflow runs
      uses: actions/github-script@v7
      with:
        script: |
          const workflows = await github.rest.actions.listRepoWorkflows({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 90); // Keep workflow runs for 90 days
          
          for (const workflow of workflows.data.workflows) {
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.id,
              per_page: 100
            });
            
            for (const run of runs.data.workflow_runs) {
              const createdAt = new Date(run.created_at);
              if (createdAt < cutoffDate && run.status === 'completed') {
                console.log(`Deleting workflow run: ${run.id} (${run.name})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
          }

  cleanup-summary:
    name: 📊 Cleanup Summary
    needs: [cleanup-artifacts, cleanup-caches, cleanup-packages, cleanup-deployments, cleanup-workflow-runs]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📊 Create cleanup summary
      uses: actions/github-script@v7
      with:
        script: |
          const results = {
            'Artifacts': '${{ needs.cleanup-artifacts.result }}',
            'Caches': '${{ needs.cleanup-caches.result }}',
            'Packages': '${{ needs.cleanup-packages.result }}',
            'Deployments': '${{ needs.cleanup-deployments.result }}',
            'Workflow Runs': '${{ needs.cleanup-workflow-runs.result }}'
          };
          
          const summary = Object.entries(results)
            .map(([name, status]) => `- ${name}: ${status}`)
            .join('\n');
          
          console.log(`🧹 Cleanup Summary:\n${summary}`);
          
          // Create an issue if any cleanup failed
          const failures = Object.entries(results).filter(([_, status]) => status === 'failure');
          
          if (failures.length > 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Cleanup Workflow Failed',
              body: `The automated cleanup workflow has failed for the following components:\n\n${failures.map(([name]) => `- ${name}`).join('\n')}\n\nPlease investigate and resolve the issues.`,
              labels: ['bug', 'infrastructure', 'needs-investigation']
            });
          }