name: 🔄 CI

on:
  push:
    branches: [ main, dev-branch ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  # Detect changes to optimize workflow execution
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔍 Detect file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Enhanced caching strategy
      - name: 📦 Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-root-

      - name: 📦 Cache frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: 📦 Cache backend dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      # Install only if cache miss
      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm ci

      - name: 📦 Install backend dependencies
        if: needs.changes.outputs.backend == 'true'
        run: cd backend && npm ci

      # Run tests only for changed components
      - name: 🧪 Test frontend
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run test -- --watchAll=false --passWithNoTests

      - name: 🧪 Test backend
        if: needs.changes.outputs.backend == 'true'
        run: cd backend && npm run test -- --passWithNoTests

      # Build only if tests pass and files changed
      - name: 🏗️ Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run build

      - name: 🏗️ Build backend
        if: needs.changes.outputs.backend == 'true'
        run: cd backend && npm run build

      - name: 📊 Summary
        run: |
          echo "✅ CI pipeline completed"
          if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
            echo "🧪 Frontend tests passed"
            echo "🏗️ Frontend build successful"
          fi
          if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
            echo "🧪 Backend tests passed"
            echo "🏗️ Backend build successful"
          fi
