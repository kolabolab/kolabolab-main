name: 🔍 Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

permissions:
  issues: write
  pull-requests: write
  contents: read
  pull-requests: read
  issues: write
  actions: read

jobs:
  # 📋 PR Validation
  pr-validation:
    name: 📋 PR Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            frontend
            backend
            api
            ui
            auth
            database
            deployment
            security
            performance
          requireScope: false
          disallowScopes: |
            release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

      - name: 📏 Check PR size
        uses: pascalgn/size-label-action@v0.4.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          sizes: >
            {
              "0": "XS",
              "20": "S",
              "50": "M",
              "200": "L",
              "800": "XL",
              "2000": "XXL"
            }

  # 🔍 Code Quality Checks
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

        with:
          version: ${{ env.PNPM_VERSION }}

      # Frontend Quality Checks
      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: 🎯 Frontend type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: 🧪 Frontend tests
        working-directory: ./frontend
        run: npm run test

      # Backend Quality Checks
      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🔍 Backend lint
        working-directory: ./backend
        run: npm run lint

      - name: 🎯 Backend type check
        working-directory: ./backend
        run: npm run build

      - name: 🧪 Backend tests
        working-directory: ./backend
        run: npm run test

      # SonarCloud Analysis
      - name: 📊 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 🔒 Security Checks
  security-checks:
    name: 🔒 Security Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/typescript
            p/react

      - name: 🔍 Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # 📸 Visual Regression Tests
  visual-tests:
    name: 📸 Visual Regression
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🎭 Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: 📸 Run visual tests
        working-directory: ./frontend
        run: npx playwright test --project=chromium --grep="visual"

      - name: 📊 Upload visual test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: frontend/test-results/
          retention-days: 7

  # 🏗️ Build Verification
  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    strategy:
      matrix:
        environment: [staging]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

        with:
          version: ${{ env.PNPM_VERSION }}

      # Verify Frontend Build
      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://staging-api.kolabolab.com
          VITE_ENVIRONMENT: staging

      - name: 📊 Analyze bundle size
        working-directory: ./frontend
        run: npx vite-bundle-analyzer dist/stats.json

      # Verify Backend Build
      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🏗️ Build backend
        working-directory: ./backend
        run: npm run build

  # 📝 Documentation Check
  docs-check:
    name: 📝 Documentation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for README updates
        uses: dorny/paths-filter@v3
        id: readme-changes
        with:
          filters: |
            readme:
              - 'README.md'
              - 'docs/**'

      - name: 📝 Validate documentation
        if: steps.readme-changes.outputs.readme == 'true'
        run: |
          echo "Documentation changes detected"
          # Add documentation validation logic here

  # ✅ PR Status Check
  pr-status:
    name: ✅ PR Status
    runs-on: ubuntu-latest
    needs: [pr-validation, code-quality, security-checks, visual-tests, build-verification, docs-check]
    if: always() && github.event.pull_request.draft == false
    
    steps:
      - name: 🎉 All checks passed
        if: needs.pr-validation.result == 'success' && needs.code-quality.result == 'success' && needs.security-checks.result == 'success' && needs.build-verification.result == 'success'
        run: |
          echo "✅ All PR checks passed! Ready for review."

      - name: ❌ Some checks failed
        if: needs.pr-validation.result == 'failure' || needs.code-quality.result == 'failure' || needs.security-checks.result == 'failure' || needs.build-verification.result == 'failure'
        run: |
          echo "❌ Some PR checks failed. Please fix the issues before merging."
          exit 1

      - name: 📧 Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🤖 PR Checks Summary')
            );
            
            const status = '${{ needs.pr-validation.result }}' === 'success' && 
                          '${{ needs.code-quality.result }}' === 'success' && 
                          '${{ needs.security-checks.result }}' === 'success' && 
                          '${{ needs.build-verification.result }}' === 'success' ? '✅' : '❌';
            
            const body = `🤖 **PR Checks Summary** ${status}
            
            | Check | Status |
            |-------|--------|
            | PR Validation | ${{ needs.pr-validation.result == 'success' && '✅' || '❌' }} |
            | Code Quality | ${{ needs.code-quality.result == 'success' && '✅' || '❌' }} |
            | Security | ${{ needs.security-checks.result == 'success' && '✅' || '❌' }} |
            | Build | ${{ needs.build-verification.result == 'success' && '✅' || '❌' }} |
            
            ${status === '✅' ? '🎉 All checks passed! This PR is ready for review.' : '⚠️ Some checks failed. Please address the issues above.'}`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
